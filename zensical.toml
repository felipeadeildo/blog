[project]
site_url = "https://adeildo.dev"
site_name = "adeildo"
site_description = "Adeildo's log and wiki: software, setup, opinions and everyday life."
site_author = "Adeildo"
copyright = "adeildo"
extra_css = ["assets/stylesheets/letter.css", "assets/stylesheets/fzf.css", "assets/stylesheets/log.css"]
extra_javascript = ["assets/javascripts/katex.js", "assets/javascripts/fzf.js", "assets/javascripts/log.js"]

nav = [
  { "log" = ["log/index.md"] },
  { "wiki" = [
    "wiki/index.md",
    { "setup" = "wiki/setup/index.md" },
    { "explainers" = "wiki/explainers/index.md" },
    { "opinions" = "wiki/opinions/index.md" },
  ] },
  { "whoami" = "whoami/index.md" },
]

[project.extra]
generator = false

[[project.extra.social]]
icon = "simple/github"
link = "https://github.com/felipeadeildo"
name = "github"

[[project.extra.social]]
icon = "lucide/rss"
link = "https://adeildo.dev/feed_rss_created.xml"
name = "rss"

[project.theme]
custom_dir = "overrides"
language = "en"
font = false
logo = "assets/images/cat.svg"
favicon = "assets/images/favicon.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
previous = "lucide/arrow-left"
next = "lucide/arrow-right"
tag.default = "lucide/hash"
admonition.note = "lucide/pencil"
admonition.tip = "lucide/lightbulb"
admonition.info = "lucide/info"
admonition.warning = "lucide/triangle-alert"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "latte"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light theme"

[project.plugins.blog]
blog_dir = "log"
blog_toc = false
post_date_format = "long"
post_url_format = "{date}/{slug}"
post_url_date_format = "yyyy"
post_readtime = true
post_excerpt = "optional"
archive = false
categories = false
pagination = false
draft_on_serve = true

[project.plugins.tags]

[project.plugins.rss]
match_path = "log/posts/.*"
date_from_meta.as_creation = "date.created"
date_from_meta.as_update = "date.updated"
categories = ["categories", "tags"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
smarty = {}
tables = {}
toc.permalink = "§"
toc.permalink_title = "Link to this section"
toc.toc_depth = 3
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.blocks.caption = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
